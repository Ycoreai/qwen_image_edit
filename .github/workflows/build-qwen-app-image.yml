name: Build and publish Qwen app-only image

on:
  push:
    branches: [main, Ycoreai-patch-1]
    paths:
      - handler.py
      - entrypoint.sh
      - workflow/**
      - Dockerfile.app
      - .dockerignore
      - .github/workflows/build-qwen-app-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qwen-app-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ycoreai/qwen-image-edit-app
  BUILDER_NAME: qwen-persistent-builder

jobs:
  build-app-image:
    # Register a persistent Linux runner with this label and enough disk space
    # to retain the 38.53 GB runtime image layers between builds.
    runs-on: [self-hosted, linux, x64, qwen-image-builder]
    steps:
      - name: Check out worker source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse persistent BuildKit builder
        shell: bash
        run: |
          if docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx use "$BUILDER_NAME"
          else
            docker buildx create --name "$BUILDER_NAME" --driver docker-container --use
          fi
          docker buildx inspect --bootstrap

      - name: Validate immutable runtime image
        env:
          RUNTIME_IMAGE: ${{ vars.QWEN_RUNTIME_IMAGE }}
        shell: bash
        run: |
          if [[ ! "$RUNTIME_IMAGE" =~ @sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Set the repository variable QWEN_RUNTIME_IMAGE to a registry image digest before running this workflow." >&2
            exit 1
          fi

      - name: Build and push app-only image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          build-args: |
            QWEN_RUNTIME_IMAGE=${{ vars.QWEN_RUNTIME_IMAGE }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false

      - name: Report image for endpoint release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "PUBLISHED_IMAGE=${IMAGE_NAME}:${GITHUB_SHA}"
            echo "PUBLISHED_IMAGE_DIGEST=${IMAGE_NAME}@${IMAGE_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
